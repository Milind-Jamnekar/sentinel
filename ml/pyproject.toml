[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Milind Jamnekar", email = "milindjamnekar502@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest>=9.1.1",
    "torch>=2.14.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
